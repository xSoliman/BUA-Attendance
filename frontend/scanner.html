<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner — BUA Attendance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>
                QR Attendance Scanner
                <span class="brand-sub">BUA Attendance System</span>
            </h1>
            <button id="change-config-btn" class="btn btn-secondary">⚙ Configuration</button>
        </header>

        <main>
            <!-- Session Selection Section -->
            <div class="session-selection-section">
                <h3>Session Setup</h3>
                <div class="session-form-inline">
                    <div class="form-group">
                        <label for="course-sheet">Course</label>
                        <select id="course-sheet">
                            <option value="">Loading courses...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="attendance-column">Week / Session</label>
                        <select id="attendance-column" disabled>
                            <option value="">Select a course first</option>
                        </select>
                    </div>
                </div>
                <div id="loading-indicator" class="hidden">Loading...</div>
            </div>

            <!-- QR Scanner -->
            <div class="scanner-container">
                <div id="qr-reader"></div>

                <!-- Loading Overlay -->
                <div id="loading-overlay" class="loading-overlay" style="display: none;">
                    <div class="loader-container">
                        <div class="loader"></div>
                        <p class="loader-text">Processing...</p>
                    </div>
                </div>
            </div>

            <!-- Manual Entry -->
            <div class="manual-entry">
                <h3>Manual Entry</h3>
                <div class="form-group">
                    <input type="text" id="manual-id" placeholder="Enter Student ID" />
                    <button id="submit-manual" class="btn btn-primary" disabled>Submit</button>
                </div>
            </div>

            <!-- Scanned Students List -->
            <div class="scanned-list-container">
                <div class="scanned-list-header">
                    <h3>Scanned Students (<span id="scan-count">0</span>)</h3>
                    <button id="download-txt" class="btn btn-small btn-secondary" title="Download as TXT" disabled>
                        ↓ Download
                    </button>
                </div>
                <div id="scanned-list" class="scanned-list">
                    <p class="empty-message">No students scanned yet</p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button id="end-session" class="btn btn-primary btn-large" disabled>
                    ✓ End Session &amp; Submit
                </button>
                <button id="clear-scans" class="btn btn-secondary" disabled>
                    🗑 Clear All
                </button>
            </div>

            <div id="toast-container"></div>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
